name: "Auto-approve composer.lock PR"

on:
  pull_request_target:
    branches: [ "master" ]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    uses: etsvThor/github-actions/.github/workflows/auto-approve.yml@master
    with:
      php-version: 8.5
      base_branch: ${{ github.event.pull_request.base.ref }}
      head_branch: ${{ github.event.pull_request.head.ref }}
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
